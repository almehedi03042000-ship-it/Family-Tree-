<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সরদার বংশবৃক্ষ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: { 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-800 dark:text-gray-100 font-['Hind_Siliguri'] overflow-hidden h-screen w-screen flex flex-col select-none">

    <header class="bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 py-2.5 flex items-center justify-between z-30 shadow-sm shrink-0">
        
        <div class="flex items-center space-x-2 space-x-reverse">
            <div class="w-9 h-9 rounded-xl bg-amber-500/10 flex items-center justify-center border border-amber-500/30">
                <i class="fa-solid fa-tree text-amber-500 text-lg"></i>
            </div>
            <h1 class="text-lg font-bold tracking-tight text-gray-900 dark:text-white">সরদার বংশবৃক্ষ</h1>
        </div>

        <div class="hidden sm:flex items-center space-x-3 space-x-reverse text-xs bg-gray-100 dark:bg-gray-800/80 px-3 py-1.5 rounded-full border border-gray-200 dark:border-gray-700">
            <div class="flex items-center space-x-1 space-x-reverse">
                <span class="text-gray-500 dark:text-gray-400">মোট:</span>
                <b id="topStatTotal" class="text-amber-500 font-bold">0</b>
            </div>
            <span class="text-gray-300 dark:text-gray-700">|</span>
            <div class="flex items-center space-x-1 space-x-reverse">
                <span class="text-gray-500 dark:text-gray-400">পুরুষ:</span>
                <b id="topStatMale" class="text-blue-500 font-bold">0</b>
            </div>
            <span class="text-gray-300 dark:text-gray-700">|</span>
            <div class="flex items-center space-x-1 space-x-reverse">
                <span class="text-gray-500 dark:text-gray-400">নারী:</span>
                <b id="topStatFemale" class="text-pink-500 font-bold">0</b>
            </div>
        </div>

        <div class="relative w-44 sm:w-64">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="বাংলা বা ইংরেজি নাম..." 
                       class="w-full bg-gray-100 dark:bg-gray-800 text-xs rounded-xl pl-8 pr-3 py-1.5 border border-transparent focus:border-amber-500 focus:bg-white dark:focus:bg-gray-900 outline-none transition shadow-inner">
                <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-gray-400 text-xs"></i>
            </div>
            <div id="searchSuggestions" class="hidden absolute left-0 right-0 top-full mt-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-2xl max-h-56 overflow-y-auto z-50 divide-y divide-gray-100 dark:divide-gray-700/50"></div>
        </div>

        <div class="flex items-center space-x-2 space-x-reverse">
            <button id="themeToggleBtn" title="Theme" class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 flex items-center justify-center transition">
                <i class="fa-solid fa-moon dark:hidden text-gray-600"></i>
                <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
            </button>
            <button id="adminLoginBtn" title="Admin" class="w-8 h-8 rounded-lg bg-amber-500 text-white hover:bg-amber-600 flex items-center justify-center shadow-md shadow-amber-500/20 transition">
                <i class="fa-solid fa-user-lock text-xs"></i>
            </button>
        </div>
    </header>

    <div class="flex-1 relative overflow-hidden">
        
        <div class="absolute bottom-6 right-6 z-20 flex flex-col space-y-1.5 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md p-1.5 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700">
            <button id="zoomInBtn" title="Zoom In" class="w-9 h-9 flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl transition text-gray-700 dark:text-gray-200"><i class="fa-solid fa-plus text-xs"></i></button>
            <button id="zoomOutBtn" title="Zoom Out" class="w-9 h-9 flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl transition text-gray-700 dark:text-gray-200"><i class="fa-solid fa-minus text-xs"></i></button>
            <button id="resetZoomBtn" title="Reset View" class="w-9 h-9 flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl transition text-gray-700 dark:text-gray-200"><i class="fa-solid fa-expand text-xs"></i></button>
            <button id="resetSubtreeBtn" title="Root Tree" class="hidden w-9 h-9 flex items-center justify-center bg-amber-500/10 text-amber-500 hover:bg-amber-500/20 rounded-xl transition"><i class="fa-solid fa-sitemap text-xs"></i></button>
        </div>

        <main id="treeContainer" class="w-full h-full cursor-grab active:cursor-grabbing relative overflow-hidden bg-gray-50 dark:bg-gray-950">
            <svg id="treeSvg" class="w-full h-full">
                <g id="treeGroup"></g>
            </svg>
        </main>
    </div>

    <div id="profileModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-900 w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden max-h-[85vh] flex flex-col border border-gray-200 dark:border-gray-800">
            <div class="relative bg-gradient-to-r from-amber-500 to-amber-600 h-24 p-4 flex items-end">
                <button id="closeProfileBtn" class="absolute top-3 right-3 text-white bg-black/20 hover:bg-black/40 rounded-full w-7 h-7 flex items-center justify-center transition"><i class="fa-solid fa-xmark text-sm"></i></button>
                <div class="flex items-center space-x-3 space-x-reverse transform translate-y-6">
                    <img id="modalPhoto" src="" class="w-20 h-20 rounded-2xl border-4 border-white dark:border-gray-900 object-cover shadow-lg bg-amber-100">
                    <div>
                        <h2 id="modalName" class="text-lg font-bold text-gray-900 dark:text-white mt-6"></h2>
                        <p id="modalNameEn" class="text-xs text-amber-100 dark:text-amber-200 italic"></p>
                        <span id="modalBadge" class="text-[10px] px-2 py-0.5 rounded-full font-semibold mt-1 inline-block"></span>
                    </div>
                </div>
            </div>
            <div class="p-5 pt-10 overflow-y-auto space-y-4 text-xs">
                <div class="grid grid-cols-2 gap-3 bg-gray-50 dark:bg-gray-800/50 p-3.5 rounded-2xl border border-gray-100 dark:border-gray-800">
                    <div><span class="text-gray-400">জন্ম:</span> <span id="modalDob" class="font-medium">-</span></div>
                    <div><span class="text-gray-400">মৃত্যু:</span> <span id="modalDod" class="font-medium">-</span></div>
                    <div><span class="text-gray-400">পেশা:</span> <span id="modalOccupation" class="font-medium">-</span></div>
                    <div><span class="text-gray-400">অবস্থা:</span> <span id="modalStatus" class="font-medium">-</span></div>
                </div>
                <div class="bg-gray-50 dark:bg-gray-800/50 p-3.5 rounded-2xl border border-gray-100 dark:border-gray-800 space-y-1.5">
                    <h4 class="font-bold text-amber-500 text-[11px] uppercase">পারিবারিক সম্পর্ক</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <div><span class="text-gray-400">পিতা:</span> <span id="modalFather" class="font-semibold">-</span></div>
                        <div><span class="text-gray-400">মাতা:</span> <span id="modalMother" class="font-semibold">-</span></div>
                    </div>
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-gray-100 dark:border-gray-800">
                    <button id="adminEditMemberBtn" class="hidden bg-amber-500 text-white px-3 py-1.5 rounded-xl font-medium hover:bg-amber-600 transition"><i class="fa-solid fa-pen-to-square mr-1"></i> এডিট করুন</button>
                    <button id="viewSubtreeBtn" class="bg-gray-900 dark:bg-white text-white dark:text-gray-900 px-4 py-2 rounded-xl font-semibold hover:opacity-90 transition">শাখাট্রি দেখুন</button>
                </div>
            </div>
        </div>
    </div>

    <div id="adminLoginModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-900 w-full max-w-sm p-5 rounded-3xl shadow-2xl relative border border-gray-200 dark:border-gray-800">
            <button id="closeAdminLoginBtn" class="absolute top-4 right-4 text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark"></i></button>
            <div class="text-center mb-4">
                <div class="w-12 h-12 bg-amber-500/10 rounded-2xl flex items-center justify-center mx-auto mb-2 text-amber-500">
                    <i class="fa-solid fa-user-shield text-xl"></i>
                </div>
                <h3 class="text-base font-bold">অ্যাডমিন লগইন</h3>
            </div>
            <form id="adminLoginForm" class="space-y-3">
                <div>
                    <label class="text-[11px] font-medium text-gray-400">পাসওয়ার্ড</label>
                    <input type="password" id="adminPassword" required placeholder="••••••••" class="w-full text-xs p-2.5 rounded-xl border dark:bg-gray-800 dark:border-gray-700 mt-1 outline-none focus:border-amber-500">
                </div>
                <button type="submit" class="w-full bg-amber-500 text-white py-2.5 rounded-xl text-xs font-bold hover:bg-amber-600 transition shadow-lg shadow-amber-500/20">লগইন</button>
            </form>
        </div>
    </div>

    <div id="adminDrawer" class="hidden fixed inset-y-0 right-0 z-50 w-full max-w-sm bg-white dark:bg-gray-900 shadow-2xl flex flex-col border-l border-gray-200 dark:border-gray-800">
        <div class="p-4 bg-amber-500 text-white flex justify-between items-center">
            <h3 class="font-bold text-sm"><i class="fa-solid fa-sliders mr-2"></i>অ্যাডমিন প্যানেল</h3>
            <button id="closeAdminBtn" class="text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="p-4 flex-1 overflow-y-auto space-y-4 text-xs">
            <form id="memberForm" class="space-y-3">
                <h4 class="font-bold text-[11px] uppercase tracking-wider text-amber-500" id="formTitle">নতুন সদস্য যোগ করুন</h4>
                <input type="hidden" id="editMemberId">
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="font-medium text-gray-400">নাম (বাংলায়)*</label>
                        <input type="text" id="formName" required class="w-full text-xs p-2 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
                    </div>
                    <div>
                        <label class="font-medium text-gray-400">Name (English)</label>
                        <input type="text" id="formNameEn" class="w-full text-xs p-2 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="font-medium text-gray-400">লিঙ্গ*</label>
                        <select id="formGender" class="w-full text-xs p-2 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
                            <option value="male">পুরুষ</option>
                            <option value="female">নারী</option>
                        </select>
                    </div>
                    <div>
                        <label class="font-medium text-gray-400">অবস্থা</label>
                        <select id="formIsDeceased" class="w-full text-xs p-2 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
                            <option value="false">জীবিত</option>
                            <option value="true">মৃত</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="font-medium text-gray-400">পিতা</label>
                        <select id="formFather" class="w-full text-xs p-2 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700"></select>
                    </div>
                    <div>
                        <label class="font-medium text-gray-400">মাতা</label>
                        <select id="formMother" class="w-full text-xs p-2 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700"></select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="font-medium text-gray-400">জন্ম তারিখ</label>
                        <input type="date" id="formDob" class="w-full text-xs p-2 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
                    </div>
                    <div>
                        <label class="font-medium text-gray-400">পেশা</label>
                        <input type="text" id="formOccupation" class="w-full text-xs p-2 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
                    </div>
                </div>

                <div>
                    <label class="font-medium text-gray-400">প্রোফাইল ছবি</label>
                    <input type="file" id="formPhotoUpload" accept="image/*" class="w-full text-xs p-1 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700">
                </div>

                <button type="submit" class="w-full bg-amber-500 text-white py-2.5 rounded-xl font-bold hover:bg-amber-600 transition shadow-md shadow-amber-500/20">সংরক্ষণ করুন</button>
            </form>

            <div class="pt-3 border-t border-gray-200 dark:border-gray-800">
                <button id="adminLogoutBtn" class="w-full bg-red-500/10 text-red-500 py-2 rounded-xl font-bold hover:bg-red-500/20 transition">অ্যাডমিন লগআউট</button>
            </div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
